name: Build & Package

on:
  workflow_dispatch: # Manual trigger from Actions tab

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npx electron-rebuild
          cd pickleglass_web && npm install && cd ..

      - name: Build renderer
        run: node build.js

      - name: Ensure web output directory
        run: mkdir -p pickleglass_web/out && echo '<html><body></body></html>' > pickleglass_web/out/index.html

      - name: Generate build-time configs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: node scripts/generate-oauth-config.js

      - name: Build macOS DMG
        run: npx electron-builder --config electron-builder.yml --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Sales-Assistant-macOS
          path: dist/*.dmg

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sales-Assistant-macOS-zip
          path: dist/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npx electron-rebuild
          cd pickleglass_web && npm install && cd ..

      - name: Build renderer
        run: node build.js

      - name: Ensure web output directory
        run: |
          if (!(Test-Path pickleglass_web/out)) { New-Item -ItemType Directory -Path pickleglass_web/out }
          Set-Content -Path pickleglass_web/out/index.html -Value '<html><body></body></html>'

      - name: Generate build-time configs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: node scripts/generate-oauth-config.js

      - name: Build Windows installer
        run: npx electron-builder --config electron-builder.yml --win --publish never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Sales-Assistant-Windows
          path: dist/*.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Sales-Assistant-Windows-portable
          path: dist/*.exe
