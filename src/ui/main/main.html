<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval'" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Glass</title>
        <style>
            :root {
                --bg-primary: #0d0d0f;
                --bg-secondary: #161619;
                --bg-tertiary: #1c1c21;
                --bg-hover: #222228;
                --bg-active: #2a2a32;
                --text-primary: #f0f0f2;
                --text-secondary: #a0a0a8;
                --text-tertiary: #6b6b75;
                --accent: #6366f1;
                --accent-hover: #818cf8;
                --accent-dim: rgba(99, 102, 241, 0.15);
                --green: #22c55e;
                --green-dim: rgba(34, 197, 94, 0.15);
                --orange: #f59e0b;
                --orange-dim: rgba(245, 158, 11, 0.15);
                --red: #ef4444;
                --border: rgba(255, 255, 255, 0.06);
                --border-light: rgba(255, 255, 255, 0.1);
                --radius: 12px;
                --radius-sm: 8px;
            }

            * { margin: 0; padding: 0; box-sizing: border-box; }

            html, body {
                height: 100%;
                background: var(--bg-primary);
                color: var(--text-primary);
                font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
                font-size: 13px;
                -webkit-font-smoothing: antialiased;
                overflow: hidden;
            }

            /* macOS title bar drag region */
            .titlebar {
                -webkit-app-region: drag;
                height: 38px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg-primary);
                border-bottom: 1px solid var(--border);
                position: relative;
                flex-shrink: 0;
            }
            .titlebar-text {
                font-size: 12px;
                font-weight: 600;
                color: var(--text-secondary);
                letter-spacing: 0.5px;
                text-transform: uppercase;
            }

            .app-container {
                display: flex;
                flex-direction: column;
                height: 100%;
            }

            .content {
                flex: 1;
                overflow-y: auto;
                padding: 20px;
            }

            .content::-webkit-scrollbar { width: 6px; }
            .content::-webkit-scrollbar-track { background: transparent; }
            .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
            .content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

            /* Hero section — shown when not on a call */
            .hero {
                text-align: center;
                padding: 40px 20px 30px;
            }
            .hero-icon {
                font-size: 48px;
                margin-bottom: 16px;
                opacity: 0.9;
            }
            .hero h1 {
                font-size: 22px;
                font-weight: 700;
                color: var(--text-primary);
                margin-bottom: 8px;
                letter-spacing: -0.3px;
            }
            .hero p {
                color: var(--text-secondary);
                font-size: 14px;
                line-height: 1.5;
                max-width: 320px;
                margin: 0 auto;
            }

            /* Status indicator */
            .status-bar {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 16px;
                background: var(--bg-secondary);
                border-radius: var(--radius-sm);
                margin-bottom: 20px;
            }
            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                flex-shrink: 0;
            }
            .status-dot.listening { background: var(--green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
            .status-dot.idle { background: var(--text-tertiary); }
            .status-text {
                font-size: 12px;
                color: var(--text-secondary);
            }

            /* Google Auth section */
            .section {
                margin-bottom: 20px;
            }
            .section-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 12px;
            }
            .section-title {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                color: var(--text-tertiary);
            }

            /* Auth card */
            .auth-card {
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 16px;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .auth-avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--bg-tertiary);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                flex-shrink: 0;
                overflow: hidden;
            }
            .auth-avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .auth-info {
                flex: 1;
                min-width: 0;
            }
            .auth-name {
                font-size: 13px;
                font-weight: 600;
                color: var(--text-primary);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .auth-email {
                font-size: 11px;
                color: var(--text-secondary);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* Buttons */
            .btn {
                -webkit-app-region: no-drag;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 8px 16px;
                border-radius: var(--radius-sm);
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                border: none;
                transition: all 0.15s ease;
                outline: none;
            }
            .btn-primary {
                background: var(--accent);
                color: white;
            }
            .btn-primary:hover { background: var(--accent-hover); }
            .btn-ghost {
                background: transparent;
                color: var(--text-secondary);
                border: 1px solid var(--border-light);
            }
            .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
            .btn-sm { padding: 5px 10px; font-size: 11px; }
            .btn-danger {
                background: transparent;
                color: var(--red);
                border: 1px solid rgba(239, 68, 68, 0.2);
            }
            .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

            /* Events list */
            .events-list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .event-card {
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 12px 14px;
                transition: background 0.15s ease;
            }
            .event-card:hover { background: var(--bg-hover); }
            .event-card.is-now {
                border-color: var(--accent);
                background: var(--accent-dim);
            }
            .event-time {
                font-size: 11px;
                color: var(--text-tertiary);
                font-weight: 500;
                margin-bottom: 3px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .event-time .now-badge {
                font-size: 9px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--accent);
                background: var(--accent-dim);
                padding: 1px 5px;
                border-radius: 3px;
            }
            .event-title {
                font-size: 13px;
                font-weight: 600;
                color: var(--text-primary);
                margin-bottom: 2px;
            }
            .event-attendees {
                font-size: 11px;
                color: var(--text-secondary);
            }
            .event-external {
                display: inline-flex;
                align-items: center;
                gap: 3px;
                color: var(--orange);
                font-size: 10px;
                font-weight: 600;
                margin-top: 4px;
            }

            /* Empty state */
            .empty-state {
                text-align: center;
                padding: 20px;
                color: var(--text-tertiary);
                font-size: 12px;
            }

            /* Divider */
            .divider {
                height: 1px;
                background: var(--border);
                margin: 16px 0;
            }

            /* Match indicator */
            .match-banner {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 14px;
                background: var(--green-dim);
                border: 1px solid rgba(34, 197, 94, 0.2);
                border-radius: var(--radius-sm);
                margin-bottom: 16px;
            }
            .match-banner-icon { font-size: 16px; }
            .match-banner-text {
                font-size: 12px;
                color: var(--green);
                font-weight: 600;
            }
            .match-banner-sub {
                font-size: 11px;
                color: var(--text-secondary);
                font-weight: 400;
            }

            /* On-call indicator */
            .call-active-banner {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 16px;
                background: var(--accent-dim);
                border: 1px solid rgba(99, 102, 241, 0.2);
                border-radius: var(--radius);
                margin-bottom: 16px;
            }
            .pulse-ring {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: var(--accent);
                position: relative;
                flex-shrink: 0;
            }
            .pulse-ring::after {
                content: '';
                position: absolute;
                inset: -4px;
                border-radius: 50%;
                border: 2px solid var(--accent);
                animation: pulse 2s ease-in-out infinite;
            }
            @keyframes pulse {
                0%, 100% { opacity: 0; transform: scale(0.8); }
                50% { opacity: 0.6; transform: scale(1.2); }
            }

            .footer {
                padding: 12px 20px;
                border-top: 1px solid var(--border);
                text-align: center;
                flex-shrink: 0;
            }
            .footer-text {
                font-size: 10px;
                color: var(--text-tertiary);
            }
        </style>
    </head>
    <body>
        <div class="app-container">
            <div class="titlebar">
                <span class="titlebar-text">Glass</span>
            </div>
            <div class="content" id="content">
                <!-- Populated by script -->
            </div>
            <div class="footer">
                <span class="footer-text">Glass — Sales Call Assistant</span>
            </div>
        </div>

        <script>
            const content = document.getElementById('content');

            // State
            let state = {
                isAuthorized: false,
                userProfile: null,
                events: [],
                isListening: false,
                matchResult: null,
            };

            function render() {
                let html = '';

                // Status bar
                if (state.isListening) {
                    html += `
                        <div class="call-active-banner">
                            <div class="pulse-ring"></div>
                            <div style="flex:1">
                                <div style="font-size:13px;font-weight:600;color:var(--accent)">On a Call</div>
                                <div style="font-size:11px;color:var(--text-secondary)">Listening and coaching in real-time</div>
                            </div>
                        </div>`;

                    if (state.matchResult && state.matchResult.matched) {
                        const src = state.matchResult.source === 'vault_active_call' ? 'CRM Dialer' : 'Calendar';
                        html += `
                            <div class="match-banner">
                                <span class="match-banner-icon">🎯</span>
                                <div>
                                    <div class="match-banner-text">Contact matched — ${state.matchResult.contact?.name || 'Unknown'}</div>
                                    <div class="match-banner-sub">via ${src}</div>
                                </div>
                            </div>`;
                    }
                } else {
                    // Hero — idle state
                    html += `
                        <div class="hero">
                            <div class="hero-icon">🎧</div>
                            <h1>Ready to coach</h1>
                            <p>Start a call on Zoom, Google Meet, or the CRM dialer — Glass will automatically begin listening, transcribing, and giving you real-time advice.</p>
                        </div>
                        <div class="divider"></div>`;
                }

                // Show HUD button — always visible
                html += `
                    <button class="btn btn-ghost" onclick="showHUD()" style="width:100%;justify-content:center;margin-bottom:20px">
                        Show HUD
                    </button>`;

                // Google Auth section
                html += `<div class="section">`;
                html += `<div class="section-header">
                    <span class="section-title">Google Account</span>
                </div>`;

                if (state.isAuthorized && state.userProfile) {
                    const photo = state.userProfile.photo
                        ? `<img src="${state.userProfile.photo}" />`
                        : '👤';
                    html += `
                        <div class="auth-card">
                            <div class="auth-avatar">${photo}</div>
                            <div class="auth-info">
                                <div class="auth-name">${state.userProfile.name || 'Connected'}</div>
                                <div class="auth-email">${state.userProfile.email || ''}</div>
                            </div>
                            <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>
                        </div>`;
                } else {
                    html += `
                        <div class="auth-card">
                            <div class="auth-avatar">🔗</div>
                            <div class="auth-info">
                                <div class="auth-name">Connect Google Calendar</div>
                                <div class="auth-email">Auto-detect contacts from your meetings</div>
                            </div>
                            <button class="btn btn-primary btn-sm" onclick="authorize()">Connect</button>
                        </div>`;
                }
                html += `</div>`;

                // Events section — only show if authorized
                if (state.isAuthorized) {
                    html += `<div class="section">`;
                    html += `<div class="section-header">
                        <span class="section-title">Today's Meetings</span>
                        <button class="btn btn-ghost btn-sm" onclick="refreshCalendar()">↻ Refresh</button>
                    </div>`;

                    if (state.events.length === 0) {
                        html += `<div class="empty-state">No meetings scheduled for today</div>`;
                    } else {
                        html += `<div class="events-list">`;
                        for (const event of state.events) {
                            const isNow = isEventNow(event);
                            const timeStr = formatEventTime(event);
                            const externalAttendees = (event.attendees || []).filter(a =>
                                !a.self && a.email && !a.email.endsWith('@shopify.com') && !a.email.endsWith('@shopify-external.com')
                            );

                            html += `
                                <div class="event-card ${isNow ? 'is-now' : ''}">
                                    <div class="event-time">
                                        ${timeStr}
                                        ${isNow ? '<span class="now-badge">Now</span>' : ''}
                                    </div>
                                    <div class="event-title">${escapeHtml(event.summary)}</div>
                                    ${externalAttendees.length > 0 ? `
                                        <div class="event-attendees">${externalAttendees.map(a => a.displayName || a.email).join(', ')}</div>
                                        <div class="event-external">⚡ External meeting</div>
                                    ` : `
                                        <div class="event-attendees" style="color:var(--text-tertiary)">Internal</div>
                                    `}
                                </div>`;
                        }
                        html += `</div>`;
                    }
                    html += `</div>`;
                }

                content.innerHTML = html;
            }

            // ─── Helpers ───

            function isEventNow(event) {
                const now = new Date();
                const buffer = 15 * 60 * 1000;
                const start = new Date(event.start);
                const end = new Date(event.end);
                return now >= new Date(start.getTime() - buffer) && now <= new Date(end.getTime() + buffer);
            }

            function formatEventTime(event) {
                const start = new Date(event.start);
                const end = new Date(event.end);
                const fmt = (d) => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                return `${fmt(start)} — ${fmt(end)}`;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ─── IPC Actions ───

            async function authorize() {
                try {
                    await window.api.glass.authorizeGoogle();
                } catch (err) {
                    console.error('Auth failed:', err);
                }
            }

            function signOut() {
                window.api.glass.signOutGoogle();
            }

            function refreshCalendar() {
                window.api.glass.refreshCalendar();
            }

            function showHUD() {
                window.api.glass.showHUD();
            }

            // ─── IPC Listeners ───

            if (window.api && window.api.glass) {
                window.api.glass.onAuthChanged((_, profile) => {
                    state.isAuthorized = profile.isAuthorized;
                    state.userProfile = profile;
                    render();
                });

                window.api.glass.onEventsUpdated((_, events) => {
                    state.events = events;
                    render();
                });

                window.api.glass.onListenStateChanged((_, isListening) => {
                    state.isListening = isListening;
                    render();
                });

                window.api.glass.onMatchResult((_, result) => {
                    state.matchResult = result;
                    render();
                });

                // Load initial state
                window.api.glass.getInitialState().then(s => {
                    state = { ...state, ...s };
                    render();
                });
            } else {
                render();
            }
        </script>
    </body>
</html>
